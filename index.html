<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="referrer"
  content="strict-origin-when-cross-origin"
>

<title>Yalla Workout</title>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #111;

  color: #eee;

}


/* =========================================================
   LAYOUT
========================================================= */

.container {

  display: flex;

  min-height: 100vh;

}


/* =========================================================
   EXERCISE ROADMAP
========================================================= */

.exercise-list {

  width: 340px;

  background: #181818;

  border-right:
    1px solid #2b2b2b;

  padding: 20px;

  overflow-y: auto;

  height: 100vh;

}


/* =========================================================
   EXERCISE ITEM
========================================================= */

.exercise-item {

  position: relative;

  padding: 8px 8px;

  margin-bottom: 2px;

  border-radius: 5px;

  color: #555;

  font-size: 0.9em;

  transition:
    background 0.2s,
    color 0.2s;

}


.exercise-item.completed {

  color: #777;

}


.exercise-item.active {

  color: #eee;

  background: #222;

}


.exercise-item.pending {

  color: #555;

}


/* =========================================================
   STATUS
========================================================= */

.status {

  display: inline-block;

  width: 24px;

  margin-right: 5px;

  text-align: center;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container {

  height: 3px;

  background: #333;

  margin:
    7px
    0
    2px
    29px;

  border-radius: 2px;

  overflow: hidden;

}


.progress-bar {

  height: 100%;

  width: 0%;

  background: #eee;

  transition:
    width 0.3s linear;

}


/* =========================================================
   MAIN
========================================================= */

.main {

  flex: 1;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  padding: 30px;

  min-width: 0;

}


/* =========================================================
   CURRENT EXERCISE
========================================================= */

#exercise {

  font-size: 2em;

  margin:
    10px
    20px
    8px;

  text-align: center;

  max-width: 800px;

}


/* =========================================================
   SOURCE
========================================================= */

#source {

  font-size: 0.8em;

  color: #666;

  margin-bottom: 20px;

}


/* =========================================================
   YOUTUBE PLAYER

   ALWAYS VISIBLE

   NO POPUP

   NO NEW PAGE

========================================================= */

.video-wrapper {

  width:
    min(760px, 100%);

  margin-bottom: 25px;

}


.video-frame {

  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

  background: #000;

  border-radius: 10px;

  overflow: hidden;

}


/*
   YouTube iframe created by the API
*/

#youtubePlayer {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

}


/* =========================================================
   TIMER
========================================================= */

#time {

  font-size: 5em;

  font-weight: bold;

  margin: 10px;

}


/* =========================================================
   TOTAL
========================================================= */

#totalLabel {

  margin-top: 20px;

  color: #666;

  font-size: 0.8em;

  letter-spacing: 1px;

}


#totalTime {

  font-size: 2em;

  margin-bottom: 25px;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 10px;

}


.controls button {

  width: 65px;

  height: 55px;

  border: 0;

  border-radius: 8px;

  background: #eee;

  color: #111;

  font-size: 1.5em;

  cursor: pointer;

}


.controls button:hover {

  background: #ccc;

}


.controls button:active {

  transform: scale(0.95);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  .container {

    flex-direction: column;

  }


  .exercise-list {

    width: 100%;

    height: 220px;

    border-right: 0;

    border-bottom:
      1px solid #2b2b2b;

  }


  .main {

    padding: 20px;

  }


  #exercise {

    font-size: 1.5em;

  }


  #time {

    font-size: 4em;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =======================================================
     LEFT ROADMAP
======================================================== -->

<aside class="exercise-list">

  <div id="routineList"></div>

</aside>



<!-- =======================================================
     MAIN WORKOUT
======================================================== -->

<main class="main">


  <!-- CURRENT EXERCISE -->

  <div id="exercise">

    Press Play

  </div>


  <!-- SOURCE -->

  <div id="source">

    Exercise demonstration

  </div>


  <!-- =====================================================
       PERMANENT YOUTUBE PLAYER

       It never opens another page.
       It never becomes a button.
       It remains inside this page.
  ====================================================== -->

  <div class="video-wrapper">

    <div class="video-frame">

      <div id="youtubePlayer"></div>

    </div>

  </div>


  <!-- TIMER -->

  <div id="time">

    00:00

  </div>


  <!-- TOTAL -->

  <div id="totalLabel">

    TOTAL ELAPSED

  </div>


  <div id="totalTime">

    00:00

  </div>


  <!-- CONTROLS -->

  <div class="controls">


    <!-- PLAY / PAUSE -->

    <button
      id="playPauseButton"
      onclick="togglePause()">

      ▶

    </button>


    <!-- PREVIOUS -->

    <button
      onclick="previousMove()">

      ‹

    </button>


    <!-- NEXT -->

    <button
      onclick="skipMove()">

      ›

    </button>


    <!-- RESET -->

    <button
      onclick="resetTimer()">

      ↻

    </button>


  </div>


</main>

</div>



<!-- =========================================================
     YOUTUBE IFRAME API
========================================================= -->

<script
  src="https://www.youtube.com/iframe_api">
</script>



<script>

/* =========================================================
   EXERCISE DATABASE

   APPROVED SOURCES:

   DAREBEE
   DAREBEE

   IMPORTANT:

   The "youtube" field contains ONLY the
   YouTube video ID.

   The player automatically converts it
   into an embedded player.

========================================================= */


const PLAYLISTS = [
  { id: "PLQSMS0J6JbrKdSOSbyJXaQ_zN_HSSp7zZ", name: "DAREBEE Exercise Library" },
  { id: "PLQSMS0J6JbrK9fA74RqpVHkzH14qvaPYH", name: "DAREBEE Workouts [FULL]" },
  { id: "PLQSMS0J6JbrKcGgbOwIknlYcFv0vrHcI3", name: "DAREBEE Combat HIIT Program [FULL]" },
  { id: "PLQSMS0J6JbrLUNzCgI3Sk32Kyio9rq0zA", name: "DAREBEE Workouts [How-To] [One Set]" }
];

// This is intentionally empty: every move is populated from ONLY the four
// DAREBEE playlists above after the YouTube IFrame API becomes ready.
let routine = [];

const playlistVideos = [];
let scrapePlaylistIndex = 0;
let scrapeVideoIndex = 0;
let scraping = false;
let playlistLoading = false;
let scrapeTimer = null;

function normaliseTitle(title) {
  return String(title || "")
    .replace(/^DAREBEE\s*[-:]\s*/i, "")
    .replace(/^Exercise Library\s*[:\-]\s*/i, "")
    .replace(/\s+/g, " ")
    .trim();
}

function isUsableVideo(title) {
  const t = normaliseTitle(title).toLowerCase();
  if (!t) return false;

  // Exclude obvious collection/program videos, not exercise names.
  const reject = ["playlist", "program", "30 day", "60 day"];
  return !reject.some(x => t.includes(x));
}

function addScrapedVideo(id, title, playlistName) {
  const clean = normaliseTitle(title);
  if (!id || !clean || !isUsableVideo(clean)) return;
  if (routine.some(x => x.youtube === id)) return;

  routine.push({
    name: clean,
    work: 30,
    rest: 15,
    source: "DAREBEE — " + playlistName,
    youtube: id
  });
}

function beginPlaylistScrape() {
  if (!youtubeReady || !player || scraping) return;

  scraping = true;
  playlistLoading = false;
  scrapePlaylistIndex = 0;
  scrapeVideoIndex = 0;
  playlistVideos.length = 0;
  routine = [];

  scrapeCurrentPlaylist();
}

function scrapeCurrentPlaylist() {
  if (scrapePlaylistIndex >= PLAYLISTS.length) {
    scrapePlaylistIndex = 0;
    scrapeVideoIndex = 0;
    scrapeNextVideoTitle();
    return;
  }

  playlistLoading = true;
  const pl = PLAYLISTS[scrapePlaylistIndex];

  try {
    player.cuePlaylist({
      listType: "playlist",
      list: pl.id,
      index: 0
    });
  } catch (e) {
    console.error("Could not load DAREBEE playlist:", pl.id, e);
    playlistLoading = false;
    scrapePlaylistIndex++;
    setTimeout(scrapeCurrentPlaylist, 250);
  }
}

function collectCurrentPlaylistIds() {
  if (!playlistLoading) return;

  const ids = player.getPlaylist ? player.getPlaylist() : [];
  if (!ids || !ids.length) {
    setTimeout(collectCurrentPlaylistIds, 1000);
    return;
  }

  playlistLoading = false;
  playlistVideos.push({
    playlist: PLAYLISTS[scrapePlaylistIndex],
    ids: ids.slice()
  });

  scrapePlaylistIndex++;
  setTimeout(scrapeCurrentPlaylist, 300);
}

function scrapeNextVideoTitle() {
  if (scrapePlaylistIndex >= playlistVideos.length) {
    finishPlaylistScrape();
    return;
  }

  const group = playlistVideos[scrapePlaylistIndex];

  if (scrapeVideoIndex >= group.ids.length) {
    scrapePlaylistIndex++;
    scrapeVideoIndex = 0;
    scrapeNextVideoTitle();
    return;
  }

  const videoId = group.ids[scrapeVideoIndex];
  clearTimeout(scrapeTimer);

  try {
    player.cueVideoById(videoId);
  } catch (e) {
    scrapeVideoIndex++;
    setTimeout(scrapeNextVideoTitle, 250);
    return;
  }

  scrapeTimer = setTimeout(() => {
    const data = player.getVideoData ? player.getVideoData() : null;
    addScrapedVideo(videoId, data && data.title, group.playlist.name);
    scrapeVideoIndex++;
    scrapeNextVideoTitle();
  }, 800);
}

function finishPlaylistScrape() {
  scraping = false;
  playlistLoading = false;
  clearTimeout(scrapeTimer);

  if (!routine.length) {
    exerciseElement.textContent = "No DAREBEE moves could be loaded";
    sourceElement.textContent = "The four approved YouTube playlists returned no usable videos.";
    return;
  }

  idx = 0;
  phase = "prepare";
  timeLeft = 0;
  elapsedSeconds = 0;
  paused = false;
  workoutStarted = false;

  buildRoutineList();
  loadVideo();
  updateDisplay();
  sourceElement.textContent =
    "DAREBEE — " + routine.length + " moves loaded from the four approved playlists";
}



/* =========================================================
   STATE
========================================================= */

let idx = 0;

let phase = "prepare";

let timeLeft = 0;

let elapsedSeconds = 0;

let timer = null;

let paused = false;

let workoutStarted = false;


/*
   YouTube player instance
*/

let player = null;

let youtubeReady = false;



/* =========================================================
   DOM ELEMENTS
========================================================= */

const exerciseElement =
  document.getElementById(
    "exercise"
  );


const sourceElement =
  document.getElementById(
    "source"
  );


const timeElement =
  document.getElementById(
    "time"
  );


const totalTimeElement =
  document.getElementById(
    "totalTime"
  );


const routineList =
  document.getElementById(
    "routineList"
  );


const playPauseButton =
  document.getElementById(
    "playPauseButton"
  );



/* =========================================================
   YOUTUBE API

   YouTube calls this automatically.
========================================================= */

function onYouTubeIframeAPIReady() {
  player = new YT.Player("youtubePlayer", {
    videoId: "xMtCZE6rEiA",
    playerVars: {
      playsinline: 1,
      rel: 0,
      origin: window.location.origin
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}



/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {
  youtubeReady = true;
  setTimeout(beginPlaylistScrape, 800);
}



function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.CUED && scraping && playlistLoading) {
    collectCurrentPlaylistIds();
  }
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

  console.log(
    "YouTube player error:",
    event.data
  );

}



/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo() {


  if (
    !youtubeReady ||
    !player
  ) {

    return;

  }


  const exercise =
    routine[idx];


  if (!exercise)
    return;


  /*
     SAME PLAYER.

     We do NOT create another iframe.

     We do NOT open YouTube.

     We only change the video.
  */

  player.cueVideoById(
    exercise.youtube
  );

}



/* =========================================================
   SPEECH
========================================================= */

function speak(text) {

  window.speechSynthesis.cancel();


  const msg =
    new SpeechSynthesisUtterance(
      text
    );


  msg.rate = 0.9;


  window.speechSynthesis.speak(
    msg
  );

}



/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (

    String(minutes)
      .padStart(2, "0")

    +

    ":"

    +

    String(secs)
      .padStart(2, "0")

  );

}



/* =========================================================
   BUILD ROADMAP
========================================================= */

function buildRoutineList() {

  routineList.innerHTML = "";


  routine.forEach(
    (exercise, i) => {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "exercise-item pending";


      item.id =
        "exercise-" + i;


      item.innerHTML = `

        <span class="status">
          ○
        </span>

        <span>
          ${exercise.name}
        </span>

        <div class="progress-container">

          <div
            class="progress-bar"
            id="progress-${i}">
          </div>

        </div>

      `;


      /*
         Clicking an exercise in
         the roadmap immediately
         loads its video.

         It remains inside this page.
      */

      item.addEventListener(
        "click",
        () => {

          selectExercise(i);

        }
      );


      routineList.appendChild(
        item
      );

    }
  );


  updateRoutineList();

}



/* =========================================================
   SELECT EXERCISE FROM ROADMAP
========================================================= */

function selectExercise(newIndex) {


  clearInterval(timer);


  window.speechSynthesis.cancel();


  idx =
    newIndex;


  phase =
    "work";


  timeLeft =
    routine[idx].work;


  workoutStarted =
    true;


  paused =
    true;


  playPauseButton.textContent =
    "▶";


  /*
     Change video in SAME player.
  */

  loadVideo();


  updateDisplay();

}



/* =========================================================
   UPDATE ROADMAP
========================================================= */

function updateRoutineList() {


  routine.forEach(
    (exercise, i) => {


      const item =
        document.getElementById(
          "exercise-" + i
        );


      if (!item)
        return;


      const progress =
        document.getElementById(
          "progress-" + i
        );


      const status =
        item.querySelector(
          ".status"
        );


      item.classList.remove(
        "active",
        "completed",
        "pending"
      );


      /* -----------------------------------------------
         COMPLETED
      ------------------------------------------------ */

      if (i < idx) {


        item.classList.add(
          "completed"
        );


        status.textContent =
          "✓";


        progress.style.width =
          "100%";

      }


      /* -----------------------------------------------
         CURRENT
      ------------------------------------------------ */

      else if (i === idx) {


        item.classList.add(
          "active"
        );


        status.textContent =
          "●";


        if (
          phase === "work" &&
          routine[idx].work > 0
        ) {


          const completed =
            routine[idx].work -
            timeLeft;


          const percentage =

            Math.min(
              100,

              Math.max(
                0,

                completed /
                routine[idx].work *
                100
              )

            );


          progress.style.width =
            percentage + "%";

        }

        else {

          progress.style.width =
            "0%";

        }


        item.scrollIntoView({

          behavior: "smooth",

          block: "center"

        });

      }


      /* -----------------------------------------------
         PENDING
      ------------------------------------------------ */

      else {


        item.classList.add(
          "pending"
        );


        status.textContent =
          "○";


        progress.style.width =
          "0%";

      }

    }
  );

}



/* =========================================================
   UPDATE MAIN DISPLAY
========================================================= */

function updateDisplay() {


  const ex =
    routine[idx];


  if (!ex)
    return;


  /* -----------------------------------------------
     PREPARE
  ------------------------------------------------ */

  if (
    phase === "prepare"
  ) {


    exerciseElement.textContent =

      "Prepare for " +

      ex.name +

      " (" +

      (idx + 1) +

      "/" +

      routine.length +

      ")";

  }


  /* -----------------------------------------------
     WORK
  ------------------------------------------------ */

  else if (
    phase === "work"
  ) {


    exerciseElement.textContent =

      ex.name +

      " (" +

      (idx + 1) +

      "/" +

      routine.length +

      ")";

  }


  /* -----------------------------------------------
     REST
  ------------------------------------------------ */

  else if (
    phase === "rest"
  ) {


    exerciseElement.textContent =

      "Rest — Next: " +

      (

        routine[idx + 1]

          ? routine[idx + 1].name

          : "Workout Complete"

      );

  }


  /*
     Always show source.
  */

  sourceElement.textContent =

    "How to: " +

    ex.source;


  timeElement.textContent =
    formatTime(
      timeLeft
    );


  totalTimeElement.textContent =
    formatTime(
      elapsedSeconds
    );


  updateRoutineList();

}



/* =========================================================
   START WORKOUT
========================================================= */

function startTimer() {

  if (!routine.length) return;

  clearInterval(timer);


  idx = 0;

  phase = "prepare";

  paused = false;

  workoutStarted = true;

  elapsedSeconds = 0;

  timeLeft = 5;


  playPauseButton.textContent =
    "❚❚";


  loadVideo();


  updateDisplay();


  speak(

    "Prepare for " +

    routine[0].name

  );


  timer =
    setInterval(
      tick,
      1000
    );

}



/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePause() {


  /*
     First press starts workout.
  */

  if (
    !workoutStarted
  ) {

    startTimer();

    return;

  }


  paused =
    !paused;


  if (paused) {


    playPauseButton.textContent =
      "▶";


    window.speechSynthesis.cancel();

  }

  else {


    playPauseButton.textContent =
      "❚❚";

  }

}



/* =========================================================
   NEXT
========================================================= */

function skipMove() {


  if (
    !workoutStarted
  )
    return;


  clearInterval(timer);


  window.speechSynthesis.cancel();


  idx++;


  if (
    idx >= routine.length
  ) {


    finishWorkout();

    return;

  }


  phase =
    "work";


  timeLeft =
    routine[idx].work;


  paused =
    false;


  playPauseButton.textContent =
    "❚❚";


  /*
     SAME YouTube player.
  */

  loadVideo();


  updateDisplay();


  speak(

    "Start " +

    routine[idx].name

  );


  timer =
    setInterval(
      tick,
      1000
    );

}



/* =========================================================
   PREVIOUS
========================================================= */

function previousMove() {


  if (
    !workoutStarted
  )
    return;


  clearInterval(timer);


  window.speechSynthesis.cancel();


  if (
    idx <= 0
  ) {


    idx = 0;

    phase =
      "prepare";

    timeLeft =
      5;


    loadVideo();


    updateDisplay();


    timer =
      setInterval(
        tick,
        1000
      );


    return;

  }


  idx--;


  phase =
    "work";


  timeLeft =
    routine[idx].work;


  paused =
    false;


  playPauseButton.textContent =
    "❚❚";


  loadVideo();


  updateDisplay();


  speak(

    "Start " +

    routine[idx].name

  );


  timer =
    setInterval(
      tick,
      1000
    );

}



/* =========================================================
   RESET
========================================================= */

function resetTimer() {


  clearInterval(timer);


  window.speechSynthesis.cancel();


  idx = 0;

  phase = "prepare";

  timeLeft = 0;

  elapsedSeconds = 0;

  paused = false;

  workoutStarted = false;


  playPauseButton.textContent =
    "▶";


  exerciseElement.textContent =
    "Press Play";


  sourceElement.textContent =
    routine.length ? "DAREBEE exercise demonstration" : "Loading DAREBEE playlists…";


  timeElement.textContent =
    "00:00";


  totalTimeElement.textContent =
    "00:00";


  /*
     Return player to first
     exercise.
  */

  loadVideo();


  updateRoutineList();

}



/* =========================================================
   TIMER TICK
========================================================= */

function tick() {


  if (paused)
    return;


  elapsedSeconds++;


  if (
    timeLeft > 0
  ) {

    timeLeft--;

  }


  /* -----------------------------------------------
     PREPARE COUNTDOWN
  ------------------------------------------------ */

  if (

    phase === "prepare" &&

    timeLeft <= 3 &&

    timeLeft > 0

  ) {

    speak(
      timeLeft.toString()
    );

  }


  if (

    phase === "prepare" &&

    timeLeft === 0

  ) {

    nextPhase();

    return;

  }


  /* -----------------------------------------------
     WORK
  ------------------------------------------------ */

  if (

    phase === "work" &&

    timeLeft === 10

  ) {

    speak(
      "10 seconds left"
    );

  }


  if (

    phase === "work" &&

    timeLeft <= 3 &&

    timeLeft > 0

  ) {

    speak(
      timeLeft.toString()
    );

  }


  if (

    phase === "work" &&

    timeLeft === 0

  ) {

    nextPhase();

    return;

  }


  /* -----------------------------------------------
     REST
  ------------------------------------------------ */

  if (

    phase === "rest" &&

    timeLeft <= 3 &&

    timeLeft > 0

  ) {

    speak(
      timeLeft.toString()
    );

  }


  if (

    phase === "rest" &&

    timeLeft === 0

  ) {

    nextPhase();

    return;

  }


  updateDisplay();

}



/* =========================================================
   NEXT PHASE
========================================================= */

function nextPhase() {


  /* -----------------------------------------------
     PREPARE → WORK
  ------------------------------------------------ */

  if (
    phase === "prepare"
  ) {


    phase =
      "work";


    timeLeft =
      routine[idx].work;


    updateDisplay();


    speak(

      "Start " +

      routine[idx].name

    );


    return;

  }


  /* -----------------------------------------------
     WORK → REST
  ------------------------------------------------ */

  if (
    phase === "work"
  ) {


    const ex =
      routine[idx];


    if (
      ex.rest === 0
    ) {


      goToNextExercise();

      return;

    }


    phase =
      "rest";


    timeLeft =
      ex.rest;


    updateDisplay();


    speak("Rest");


    /*
       Tell user the next exercise.
    */

    if (
      idx + 1 <
      routine.length
    ) {


      setTimeout(
        () => {


          if (

            phase === "rest" &&

            !paused

          ) {


            speak(

              "Next exercise is " +

              routine[
                idx + 1
              ].name

            );

          }

        },

        2000

      );

    }


    return;

  }


  /* -----------------------------------------------
     REST → NEXT
  ------------------------------------------------ */

  if (
    phase === "rest"
  ) {


    goToNextExercise();

  }

}



/* =========================================================
   NEXT EXERCISE
========================================================= */

function goToNextExercise() {


  idx++;


  if (
    idx >= routine.length
  ) {


    finishWorkout();

    return;

  }


  phase =
    "work";


  timeLeft =
    routine[idx].work;


  /*
     Change video.

     SAME PLAYER.
  */

  loadVideo();


  updateDisplay();


  speak(

    "Start " +

    routine[idx].name

  );

}



/* =========================================================
   FINISH
========================================================= */

function finishWorkout() {


  clearInterval(timer);


  window.speechSynthesis.cancel();


  workoutStarted =
    false;


  paused =
    false;


  playPauseButton.textContent =
    "▶";


  exerciseElement.textContent =
    "Workout Complete!";


  sourceElement.textContent =
    "";


  timeElement.textContent =
    "00:00";


  totalTimeElement.textContent =
    formatTime(
      elapsedSeconds
    );


  /*
     Mark every exercise complete.
  */

  routine.forEach(
    (exercise, i) => {


      const item =
        document.getElementById(
          "exercise-" + i
        );


      if (!item)
        return;


      const status =
        item.querySelector(
          ".status"
        );


      const progress =
        document.getElementById(
          "progress-" + i
        );


      item.classList.remove(
        "active",
        "pending"
      );


      item.classList.add(
        "completed"
      );


      status.textContent =
        "✓";


      progress.style.width =
        "100%";

    }
  );


  speak(
    "Workout complete"
  );

}



/* =========================================================
   INITIALIZE
========================================================= */

buildRoutineList();

</script>

</body>

</html>
