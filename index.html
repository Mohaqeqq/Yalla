/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;
}

body {
    font-family:

    color: #eee;

    overflow: hidden;

/* =========================================================
   APP
========================================================= */

    display: flex;
    width: 100%;
    height: 100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

    width: 340px;
    flex-shrink: 0;

    border-right: 1px solid #292929;

    overflow-y: auto;

    padding: 18px 14px;

/* =========================================================
   EXERCISE ITEM
========================================================= */

    position: relative;

    padding: 9px 10px;

    margin-bottom: 3px;

    border-radius: 6px;

    color: #555;

    font-size: 14px;

    cursor: pointer;

    user-select: none;

    transition:
        background 0.15s ease,
        color 0.15s ease;
}

.exercise-item:hover {
    background: #202020;
    color: #aaa;
}

.exercise-item.active {
    background: #242424;
    color: #eee;
}

.exercise-item.completed {
    color: #777;
}

.exercise-item.pending {
    color: #555;
}


/* =========================================================
   ITEM
========================================================= */

.exercise-top {
    display: flex;
    align-items: center;
}

.status {

    width: 24px;

    flex-shrink: 0;

    margin-right: 4px;

    text-align: center;

    color: inherit;
}

.exercise-name {
    flex: 1;
}


/* =========================================================
   BLOCK LABEL
========================================================= */

.block-label {

    margin:
        18px
        8px
        7px;

    color: #444;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container {

    height: 3px;

    margin:
        7px
        0
        0
        28px;

    background: #303030;

    border-radius: 3px;

    overflow: hidden;
}

.progress-bar {

    width: 0%;
    height: 100%;

    background: #eee;

}


/* =========================================================
   MAIN
========================================================= */

.main {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:

        35px;

/* =========================================================
   CURRENT EXERCISE
========================================================= */

#exercise {

    max-width: 800px;

        0
        0
        7px;

    text-align: center;

    font-size: 28px;

    font-weight: 600;

/* =========================================================
   SOURCE
========================================================= */

    color: #666;

    font-size: 12px;

   VIDEO
========================================================= */

.video-wrapper {

    margin-bottom: 24px;
}


.video-frame {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.35);
}


#youtubePlayer {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;
}


/* =========================================================
   VIDEO PLACEHOLDER
========================================================= */

.video-placeholder {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #090909;

    color: #555;

    font-size: 13px;

    pointer-events: none;

    z-index: 2;
}

.video-placeholder.hidden {
    display: none;
}


/* =========================================================
   PLAYER STATUS
========================================================= */

.player-status {

    width: 100%;

    max-width: 760px;

    height: 18px;

    margin-top: 8px;

    text-align: right;

    color: #444;

    font-size: 10px;

   TIMER
========================================================= */

        0

========================================================= */

    letter-spacing: 1.5px;
}

#totalTime {

        0
        22px;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;
}

.controls button {

    width: 62px;
    height: 52px;

    border: 0;

    border-radius: 8px;

    background: #eee;

    color: #111;

    font-size: 23px;

    cursor: pointer;

        transform 0.08s ease,
        background 0.15s ease;

.controls button:hover {
    background: #ccc;
}

.controls button:active {

/* =========================================================
   MOBILE
========================================================= */

    }

    .video-wrapper {
        margin-bottom: 18px;
    }

    .controls button {
        width: 55px;
        height: 48px;
    }
}

/* =========================================================

========================================================= */

let currentIndex = 0;

let phase = "prepare";

let timeLeft = 0;

let elapsedSeconds = 0;

let timer = null;

let paused = false;

let workoutStarted = false;

let youtubeReady = false;

let player = null;


/* =========================================================
   DOM
========================================================= */

const exerciseElement =

const sourceElement =

const playerStatus =

/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtubePlayer",
        {

            width: "100%",

            height: "100%",

            playerVars: {

                playsinline: 1,

                rel: 0,

                modestbranding: 1,

                iv_load_policy: 3

            },

            events: {

                onReady:
                    onPlayerReady,

                onStateChange:
                    onPlayerStateChange,

                onError:
                    onPlayerError
            }
        }
    );
}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    youtubeReady = true;

    videoPlaceholder.classList.add(
        "hidden"
    );

    playerStatus.textContent =
        "DAREBEE • ready";

    loadExerciseVideo(
        currentIndex,
        false
    );
}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data === YT.PlayerState.PLAYING
    ) {

        playerStatus.textContent =
            "DAREBEE • playing";

    }

    else if (
        event.data === YT.PlayerState.PAUSED
    ) {

        playerStatus.textContent =
            "DAREBEE • paused";

    }

    else if (
        event.data === YT.PlayerState.ENDED
    ) {

        playerStatus.textContent =
            "DAREBEE • video ended";
    }
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );

    playerStatus.textContent =
        "YouTube video unavailable";
}


/* =========================================================
   LOAD EXACT VIDEO
========================================================= */

function loadExerciseVideo(
    index,
    autoplay = false
) {

    if (
        !youtubeReady ||
        !player
    ) {
        return;
    }


    const exercise =
        routine[index];

    if (!exercise) {
        return;
    }


    /*
       NEVER load a fake ID.
    */

    if (
        !exercise.videoId ||
        exercise.videoId === "VIDEO_ID_HERE"
    ) {

        playerStatus.textContent =
            "DAREBEE video ID not assigned";

        videoPlaceholder.classList.remove(
            "hidden"
        );

        videoPlaceholder.textContent =
            "DAREBEE video ID required";

        return;
    }


    /*
       THIS is what guarantees that the
       video corresponds to the exercise.

       No playlist index.
       No random playlist position.
       No search.
    */

    videoPlaceholder.classList.remove(
        "hidden"
    );

    videoPlaceholder.textContent =
        "Loading DAREBEE video...";


    playerStatus.textContent =
        "DAREBEE • loading";


    player.loadVideoById({

        videoId:
            exercise.videoId,

        startSeconds:
            0

    });


    setTimeout(
        () => {

            videoPlaceholder.classList.add(
                "hidden"
            );

            if (
                autoplay &&
                player
            ) {

                player.playVideo();

            }

        },
        700
    );
}


/* =========================================================
   SPEECH
========================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(
            text
        );

    message.rate = 0.9;

    window.speechSynthesis.speak(
        message
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    return (

        String(minutes)
            .padStart(2, "0")

        +

        ":"

        +

        String(secs)
            .padStart(2, "0")
    );
}


/* =========================================================
   BUILD ROADMAP
========================================================= */

function buildRoutineList() {

    routineList.innerHTML = "";

    let lastBlock = "";


    routine.forEach(
        (exercise, index) => {


            /*
               Block heading
            */

            if (
                exercise.block !== lastBlock
            ) {

                const heading =
                    document.createElement(
                        "div"
                    );

                heading.className =
                    "block-label";

                heading.textContent =
                    exercise.block;

                routineList.appendChild(
                    heading
                );

                lastBlock =
                    exercise.block;
            }


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "exercise-item pending";

            item.id =
                "exercise-" + index;


            item.innerHTML = `

                <div class="exercise-top">

                    <span class="status">
                        ○
                    </span>

                    <span class="exercise-name">
                        ${exercise.name}
                    </span>

                </div>

                <div class="progress-container">

                    <div
                        class="progress-bar"
                        id="progress-${index}">
                    </div>

                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    selectExercise(
                        index
                    );

                }
            );


            routineList.appendChild(
                item
            );

        }
    );


    updateRoutineList();
}


/* =========================================================
   SELECT EXERCISE
========================================================= */

function selectExercise(index) {

    clearInterval(timer);

    window.speechSynthesis.cancel();

    currentIndex =
        index;

    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    workoutStarted =
        true;

    paused =
        true;

    playPauseButton.textContent =
        "▶";


    loadExerciseVideo(
        currentIndex,
        false
    );


    updateDisplay();
}


/* =========================================================
   ROADMAP
========================================================= */

function updateRoutineList() {

    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }


            const status =
                item.querySelector(
                    ".status"
                );

            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "completed",
                "pending"
            );


            if (
                index < currentIndex
            ) {

                item.classList.add(
                    "completed"
                );

                status.textContent =
                    "✓";

                progress.style.width =
                    "100%";
            }


            else if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

                status.textContent =
                    "●";


                if (
                    phase === "work"
                ) {

                    const completed =
                        exercise.work -
                        timeLeft;

                    const percentage =
                        Math.min(
                            100,
                            Math.max(
                                0,
                                (
                                    completed /
                                    exercise.work
                                ) * 100
                            )
                        );

                    progress.style.width =
                        percentage + "%";
                }

                else {

                    progress.style.width =
                        "0%";
                }


                item.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }


            else {

                item.classList.add(
                    "pending"
                );

                status.textContent =
                    "○";

                progress.style.width =
                    "0%";
            }

        }
    );
}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

    const exercise =
        routine[
            currentIndex
        ];

    if (!exercise) {
        return;
    }


    if (
        phase === "prepare"
    ) {

        exerciseElement.textContent =
            "Prepare for " +
            exercise.name +
            " (" +
            (currentIndex + 1) +
            "/" +
            routine.length +
            ")";

    }


    else if (
        phase === "work"
    ) {

        exerciseElement.textContent =
            exercise.name +
            " (" +
            (currentIndex + 1) +
            "/" +
            routine.length +
            ")";

    }


    else if (
        phase === "rest"
    ) {

        const next =
            routine[
                currentIndex + 1
            ];

        exerciseElement.textContent =
            "Rest — Next: " +
            (
                next
                    ? next.name
                    : "Workout Complete"
            );
    }


    sourceElement.textContent =
        "How to: DAREBEE";


    timeElement.textContent =
        formatTime(
            timeLeft
        );


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    updateRoutineList();
}


/* =========================================================
   START
========================================================= */

function startTimer() {

    clearInterval(timer);

    currentIndex =
        0;

    phase =
        "prepare";

    paused =
        false;

    workoutStarted =
        true;

    elapsedSeconds =
        0;

    timeLeft =
        5;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        0,
        true
    );


    updateDisplay();


    speak(
        "Prepare for " +
        routine[0].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePause() {

    if (
        !workoutStarted
    ) {

        startTimer();

        return;
    }


    paused =
        !paused;


    if (paused) {

        playPauseButton.textContent =
            "▶";

        window.speechSynthesis.cancel();


        if (
            youtubeReady &&
            player
        ) {

            player.pauseVideo();
        }

    }

    else {

        playPauseButton.textContent =
            "❚❚";


        if (
            youtubeReady &&
            player
        ) {

            player.playVideo();
        }
    }
}


/* =========================================================
   NEXT
========================================================= */

function skipMove() {

    if (
        !workoutStarted
    ) {
        return;
    }


    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousMove() {

    if (
        !workoutStarted
    ) {
        return;
    }


    clearInterval(timer);

    window.speechSynthesis.cancel();


    if (
        currentIndex <= 0
    ) {

        currentIndex =
            0;

        phase =
            "prepare";

        timeLeft =
            5;

        loadExerciseVideo(
            0,
            false
        );

        updateDisplay();

        return;
    }


    currentIndex--;


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   RESET
========================================================= */

function resetTimer() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex =
        0;

    phase =
        "prepare";

    timeLeft =
        0;

    elapsedSeconds =
        0;

    paused =
        false;

    workoutStarted =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Press Play";


    sourceElement.textContent =
        "DAREBEE Exercise Library";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        "00:00";


    loadExerciseVideo(
        0,
        false
    );


    updateRoutineList();
}


/* =========================================================
   TIMER
========================================================= */

function tick() {

    if (paused) {
        return;
    }


    elapsedSeconds++;


    if (
        timeLeft > 0
    ) {

        timeLeft--;
    }


    /* PREPARE */

    if (

        phase === "prepare" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );
    }


    if (

        phase === "prepare" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    /* WORK */

    if (

        phase === "work" &&

        timeLeft === 10

    ) {

        speak(
            "10 seconds left"
        );
    }


    if (

        phase === "work" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );
    }


    if (

        phase === "work" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    /* REST */

    if (

        phase === "rest" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );
    }


    if (

        phase === "rest" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    updateDisplay();
}


/* =========================================================
   NEXT PHASE
========================================================= */

function nextPhase() {


    /* PREPARE → WORK */

    if (
        phase === "prepare"
    ) {

        phase =
            "work";

        timeLeft =
            routine[
                currentIndex
            ].work;


        updateDisplay();


        speak(
            "Start " +
            routine[
                currentIndex
            ].name
        );


        return;
    }


    /* WORK → REST */

    if (
        phase === "work"
    ) {

        const exercise =
            routine[
                currentIndex
            ];


        if (
            exercise.rest === 0
        ) {

            goToNextExercise();

            return;
        }


        phase =
            "rest";

        timeLeft =
            exercise.rest;


        updateDisplay();

        speak("Rest");

        return;
    }


    /* REST → NEXT */

    if (
        phase === "rest"
    ) {

        goToNextExercise();
    }
}


/* =========================================================
   NEXT EXERCISE
========================================================= */

function goToNextExercise() {

    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishWorkout() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    workoutStarted =
        false;

    paused =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Workout Complete!";


    sourceElement.textContent =
        "";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }


            const status =
                item.querySelector(
                    ".status"
                );


            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "pending"
            );


            item.classList.add(
                "completed"
            );


            status.textContent =
                "✓";


            progress.style.width =
                "100%";
        }
    );


    speak(
        "Workout complete"
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

buildRoutineList();

</script>

</body>

</html>
