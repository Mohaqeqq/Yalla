/* =========================================================
   STATE
========================================================= */

let currentIndex = 0;

let phase = "prepare";

let timeLeft = 0;

let elapsedSeconds = 0;

let timer = null;

let paused = false;

let workoutStarted = false;

let youtubeReady = false;

let player = null;


/* =========================================================
   DOM
========================================================= */

const exerciseElement =
    document.getElementById("exercise");

const sourceElement =
    document.getElementById("source");

const timeElement =
    document.getElementById("time");

const totalTimeElement =
    document.getElementById("totalTime");

const routineList =
    document.getElementById("routineList");

const playPauseButton =
    document.getElementById("playPauseButton");

const videoPlaceholder =
    document.getElementById("videoPlaceholder");

const playerStatus =
    document.getElementById("playerStatus");


/* =========================================================
   YOUTUBE API READY
========================================================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtubePlayer",
        {

            /*
               IMPORTANT:

               We initialize the player with the
               DAREBEE playlist itself.

               No fake video ID.
            */

            playerVars: {

                listType: "playlist",

                list: DAREBEE_PLAYLIST,

                playsinline: 1,

                rel: 0,

                modestbranding: 1,

                iv_load_policy: 3

            },

            events: {

                onReady:
                    onPlayerReady,

                onStateChange:
                    onPlayerStateChange,

                onError:
                    onPlayerError

            }

        }
    );
}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    youtubeReady = true;

    videoPlaceholder.classList.add(
        "hidden"
    );

    playerStatus.textContent =
        "DAREBEE Exercise Library";

    /*
       Select the first exercise.
    */

    loadExerciseVideo(
        currentIndex,
        false
    );
}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    /*
       YouTube is playing.
    */

    if (
        event.data === YT.PlayerState.PLAYING
    ) {

        playerStatus.textContent =
            "DAREBEE • playing";

    }


    /*
       Paused.
    */

    else if (
        event.data === YT.PlayerState.PAUSED
    ) {

        playerStatus.textContent =
            "DAREBEE • paused";

    }


    /*
       Ended.
    */

    else if (
        event.data === YT.PlayerState.ENDED
    ) {

        playerStatus.textContent =
            "DAREBEE • video ended";

    }

}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );

    playerStatus.textContent =
        "YouTube video unavailable";
}


/* =========================================================
   LOAD EXERCISE VIDEO
=========================================================

   THIS IS THE IMPORTANT PART.

   We use:

       loadPlaylist()

   rather than pretending a playlist index is
   a video ID.

========================================================= */

function loadExerciseVideo(
    index,
    autoplay = false
) {

    if (
        !youtubeReady ||
        !player
    ) {
        return;
    }

    const exercise =
        routine[index];

    if (!exercise) {
        return;
    }


    /*
       Tell the existing player to load the
       DAREBEE playlist and select the desired item.
    */

    player.loadPlaylist({

        listType: "playlist",

        list: DAREBEE_PLAYLIST,

        index:
            exercise.playlistIndex,

        startSeconds: 0

    });


    /*
       autoplay is optional.

       We use it when moving to the next
       exercise during the workout.
    */

    if (autoplay) {

        setTimeout(
            () => {

                if (
                    player &&
                    youtubeReady
                ) {

                    player.playVideo();

                }

            },
            500
        );

    }


    playerStatus.textContent =
        "DAREBEE • loading";
}


/* =========================================================
   SPEECH
========================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(
            text
        );

    message.rate = 0.9;

    window.speechSynthesis.speak(
        message
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    return (

        String(minutes)
            .padStart(2, "0")

        +

        ":"

        +

        String(secs)
            .padStart(2, "0")
    );
}


/* =========================================================
   BUILD ROADMAP
========================================================= */

function buildRoutineList() {

    routineList.innerHTML = "";

    routine.forEach(
        (exercise, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "exercise-item pending";

            item.id =
                "exercise-" + index;


            item.innerHTML = `

                <div class="exercise-top">

                    <span class="status">
                        ○
                    </span>

                    <span class="exercise-name">
                        ${exercise.name}
                    </span>

                </div>

                <div class="progress-container">

                    <div
                        class="progress-bar"
                        id="progress-${index}">
                    </div>

                </div>
            `;


            /*
               Clicking an exercise immediately
               changes the same YouTube player.
            */

            item.addEventListener(
                "click",
                () => {

                    selectExercise(
                        index
                    );

                }
            );


            routineList.appendChild(
                item
            );

        }
    );


    updateRoutineList();
}


/* =========================================================
   SELECT EXERCISE
========================================================= */

function selectExercise(index) {

    clearInterval(timer);

    window.speechSynthesis.cancel();

    currentIndex =
        index;

    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    workoutStarted =
        true;

    paused =
        true;

    playPauseButton.textContent =
        "▶";


    /*
       Change the video in the SAME player.
    */

    loadExerciseVideo(
        currentIndex,
        false
    );


    updateDisplay();
}


/* =========================================================
   UPDATE ROADMAP
========================================================= */

function updateRoutineList() {

    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }

            const status =
                item.querySelector(
                    ".status"
                );

            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "completed",
                "pending"
            );


            /*
               COMPLETED
            */

            if (
                index < currentIndex
            ) {

                item.classList.add(
                    "completed"
                );

                status.textContent =
                    "✓";

                progress.style.width =
                    "100%";

            }


            /*
               CURRENT
            */

            else if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

                status.textContent =
                    "●";


                if (
                    phase === "work"
                ) {

                    const completed =
                        exercise.work -
                        timeLeft;

                    const percentage =
                        Math.min(
                            100,
                            Math.max(
                                0,
                                (
                                    completed /
                                    exercise.work
                                ) * 100
                            )
                        );

                    progress.style.width =
                        percentage + "%";

                }

                else {

                    progress.style.width =
                        "0%";

                }


                /*
                   Keep current exercise
                   visible in roadmap.
                */

                item.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }


            /*
               PENDING
            */

            else {

                item.classList.add(
                    "pending"
                );

                status.textContent =
                    "○";

                progress.style.width =
                    "0%";

            }

        }
    );
}


/* =========================================================
   UPDATE DISPLAY
========================================================= */

function updateDisplay() {

    const exercise =
        routine[
            currentIndex
        ];

    if (!exercise) {
        return;
    }


    if (
        phase === "prepare"
    ) {

        exerciseElement.textContent =

            "Prepare for " +

            exercise.name +

            " (" +

            (currentIndex + 1) +

            "/" +

            routine.length +

            ")";

    }


    else if (
        phase === "work"
    ) {

        exerciseElement.textContent =

            exercise.name +

            " (" +

            (currentIndex + 1) +

            "/" +

            routine.length +

            ")";

    }


    else if (
        phase === "rest"
    ) {

        const next =
            routine[
                currentIndex + 1
            ];


        exerciseElement.textContent =

            "Rest — Next: " +

            (
                next
                    ? next.name
                    : "Workout Complete"
            );

    }


    sourceElement.textContent =
        "How to: DAREBEE";


    timeElement.textContent =
        formatTime(
            timeLeft
        );


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    updateRoutineList();
}


/* =========================================================
   START WORKOUT
========================================================= */

function startTimer() {

    clearInterval(timer);

    currentIndex = 0;

    phase =
        "prepare";

    paused =
        false;

    workoutStarted =
        true;

    elapsedSeconds =
        0;

    timeLeft =
        5;


    playPauseButton.textContent =
        "❚❚";


    /*
       Load first DAREBEE video.
    */

    loadExerciseVideo(
        0,
        true
    );


    updateDisplay();


    speak(
        "Prepare for " +
        routine[0].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePause() {

    /*
       First press starts workout.
    */

    if (
        !workoutStarted
    ) {

        startTimer();

        return;
    }


    paused =
        !paused;


    if (paused) {

        playPauseButton.textContent =
            "▶";

        window.speechSynthesis.cancel();


        if (
            youtubeReady &&
            player
        ) {

            player.pauseVideo();

        }

    }

    else {

        playPauseButton.textContent =
            "❚❚";


        if (
            youtubeReady &&
            player
        ) {

            player.playVideo();

        }

    }
}


/* =========================================================
   NEXT MOVE
========================================================= */

function skipMove() {

    if (
        !workoutStarted
    ) {
        return;
    }

    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PREVIOUS MOVE
========================================================= */

function previousMove() {

    if (
        !workoutStarted
    ) {
        return;
    }

    clearInterval(timer);

    window.speechSynthesis.cancel();


    if (
        currentIndex <= 0
    ) {

        currentIndex = 0;

        phase =
            "prepare";

        timeLeft =
            5;


        loadExerciseVideo(
            0,
            false
        );


        updateDisplay();

        return;
    }


    currentIndex--;


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   RESET
========================================================= */

function resetTimer() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex =
        0;

    phase =
        "prepare";

    timeLeft =
        0;

    elapsedSeconds =
        0;

    paused =
        false;

    workoutStarted =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Press Play";


    sourceElement.textContent =
        "DAREBEE Exercise Library";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        "00:00";


    loadExerciseVideo(
        0,
        false
    );


    updateRoutineList();
}


/* =========================================================
   TIMER
========================================================= */

function tick() {

    if (paused) {
        return;
    }


    elapsedSeconds++;


    if (
        timeLeft > 0
    ) {

        timeLeft--;

    }


    /*
       PREPARE
    */

    if (

        phase === "prepare" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "prepare" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    /*
       WORK
    */

    if (

        phase === "work" &&

        timeLeft === 10

    ) {

        speak(
            "10 seconds left"
        );

    }


    if (

        phase === "work" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "work" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    /*
       REST
    */

    if (

        phase === "rest" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "rest" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    updateDisplay();
}


/* =========================================================
   NEXT PHASE
========================================================= */

function nextPhase() {


    /*
       PREPARE → WORK
    */

    if (
        phase === "prepare"
    ) {

        phase =
            "work";

        timeLeft =
            routine[
                currentIndex
            ].work;


        updateDisplay();


        speak(
            "Start " +
            routine[
                currentIndex
            ].name
        );


        return;
    }


    /*
       WORK → REST
    */

    if (
        phase === "work"
    ) {

        const exercise =
            routine[
                currentIndex
            ];


        if (
            exercise.rest === 0
        ) {

            goToNextExercise();

            return;
        }


        phase =
            "rest";

        timeLeft =
            exercise.rest;


        updateDisplay();


        speak("Rest");


        /*
           Announce next exercise.
        */

        if (
            currentIndex + 1 <
            routine.length
        ) {

            setTimeout(
                () => {

                    if (

                        phase === "rest" &&

                        !paused

                    ) {

                        speak(
                            "Next exercise is " +

                            routine[
                                currentIndex + 1
                            ].name
                        );

                    }

                },
                2000
            );

        }

        return;
    }


    /*
       REST → NEXT
    */

    if (
        phase === "rest"
    ) {

        goToNextExercise();

    }
}


/* =========================================================
   NEXT EXERCISE
========================================================= */

function goToNextExercise() {

    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishWorkout() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    workoutStarted =
        false;

    paused =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Workout Complete!";


    sourceElement.textContent =
        "";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    /*
       Mark everything complete.
    */

    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }


            const status =
                item.querySelector(
                    ".status"
                );


            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "pending"
            );


            item.classList.add(
                "completed"
            );


            status.textContent =
                "✓";


            progress.style.width =
                "100%";

        }
    );


    speak(
        "Workout complete"
    );
}


/* =========================================================
   INITIALIZE
========================================================= */

buildRoutineList();

</script>
