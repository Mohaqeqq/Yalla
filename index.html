<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Yalla Workout</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111;
    color: #eee;

    overflow: hidden;
}

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 340px;
    flex-shrink: 0;

    background: #181818;

    border-right: 1px solid #292929;

    overflow-y: auto;

    padding: 18px 14px;
}

.exercise-item {

    position: relative;

    padding: 9px 10px;

    margin-bottom: 3px;

    border-radius: 6px;

    color: #555;

    font-size: 14px;

    cursor: pointer;

    user-select: none;

    transition:
        background 0.15s ease,
        color 0.15s ease;
}

.exercise-item:hover {
    background: #202020;
    color: #aaa;
}

.exercise-item.active {
    background: #242424;
    color: #eee;
}

.exercise-item.completed {
    color: #777;
}

.exercise-item.pending {
    color: #555;
}

.exercise-top {
    display: flex;
    align-items: center;
}

.status {

    width: 24px;

    flex-shrink: 0;

    margin-right: 4px;

    text-align: center;

    color: inherit;
}

.exercise-name {
    flex: 1;
}

.progress-container {

    height: 3px;

    margin:
        7px
        0
        0
        28px;

    background: #303030;

    border-radius: 3px;

    overflow: hidden;
}

.progress-bar {

    width: 0%;
    height: 100%;

    background: #eee;

    transition: width 0.2s linear;
}


/* =========================================================
   MAIN
========================================================= */

.main {

    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 25px 35px;

    overflow-y: auto;
}

#exercise {

    width: 100%;

    max-width: 800px;

    margin: 0 0 7px;

    text-align: center;

    font-size: 28px;

    font-weight: 600;
}

#source {

    margin-bottom: 18px;

    color: #666;

    font-size: 12px;
}


/* =========================================================
   VIDEO
========================================================= */

.video-wrapper {

    width: min(760px, 100%);

    margin-bottom: 8px;
}

.video-frame {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.35);
}

#youtubePlayer {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;
}

.video-placeholder {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #090909;

    color: #555;

    font-size: 13px;

    z-index: 2;

    pointer-events: none;
}

.video-placeholder.hidden {
    display: none;
}

.player-status {

    width: 100%;

    max-width: 760px;

    height: 18px;

    margin-bottom: 12px;

    text-align: right;

    color: #444;

    font-size: 10px;
}


/* =========================================================
   TIMER
========================================================= */

#time {

    margin: 0 0 8px;

    font-size: 72px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: 2px;
}

#totalLabel {

    margin-top: 10px;

    color: #555;

    font-size: 10px;

    letter-spacing: 1.5px;
}

#totalTime {

    margin: 4px 0 22px;

    font-size: 25px;

    color: #888;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;
}

.controls button {

    width: 62px;
    height: 52px;

    border: 0;

    border-radius: 8px;

    background: #eee;

    color: #111;

    font-size: 23px;

    cursor: pointer;

    transition:
        transform 0.08s ease,
        background 0.15s ease;
}

.controls button:hover {
    background: #ccc;
}

.controls button:active {
    transform: scale(0.94);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {
        overflow: auto;
    }

    .app {
        height: auto;
        min-height: 100vh;
        flex-direction: column;
    }

    .sidebar {

        width: 100%;

        height: 220px;

        border-right: 0;

        border-bottom: 1px solid #292929;
    }

    .main {

        min-height: calc(100vh - 220px);

        height: auto;

        padding: 20px 15px;
    }

    #exercise {
        font-size: 21px;
    }

    #time {
        font-size: 55px;
    }

    .controls button {
        width: 55px;
        height: 48px;
    }
}

</style>

</head>


<body>

<div class="app">


<!-- =======================================================
     SIDEBAR
======================================================== -->

<aside class="sidebar">

    <div id="routineList"></div>

</aside>


<!-- =======================================================
     MAIN
======================================================== -->

<main class="main">

    <div id="exercise">
        Press Play
    </div>

    <div id="source">
        DAREBEE
    </div>


    <div class="video-wrapper">

        <div class="video-frame">

            <div id="youtubePlayer"></div>

            <div
                id="videoPlaceholder"
                class="video-placeholder">

                YouTube video loading...

            </div>

        </div>

    </div>


    <div
        id="playerStatus"
        class="player-status">

        YouTube player loading...

    </div>


    <div id="time">
        00:00
    </div>


    <div id="totalLabel">
        TOTAL ELAPSED
    </div>

    <div id="totalTime">
        00:00
    </div>


    <div class="controls">

        <button
            id="playPauseButton"
            onclick="togglePause()">
            ▶
        </button>

        <button
            onclick="previousMove()">
            ‹
        </button>

        <button
            onclick="skipMove()">
            ›
        </button>

        <button
            onclick="resetTimer()">
            ↻
        </button>

    </div>

</main>

</div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   EXACT DAREBEE PLAYLIST SOURCES
========================================================= */

const DAREBEE_HOW_TO_PLAYLIST =
    "PLQSMS0J6JbrLUNzCgI3Sk32Kyio9rq0zA";

const DAREBEE_FULL_PLAYLIST =
    "PLQSMS0J6JbrK9fA74RqpVHkzH14qvaPYH";

const DAREBEE_EXERCISE_LIBRARY =
    "PLQSMS0J6JbrKdSOSbyJXaQ_zN_HSSp7zZ";


/* =========================================================
   WORKOUT DATABASE
=========================================================

   IMPORTANT:

   videoId is the ACTUAL YouTube video ID.

   NEVER use playlistIndex here.

   When we verify another DAREBEE exercise, we add:

       videoId: "xxxxxxxxxxx"

   The player will then load exactly that video.

========================================================= */


/*
   These are the three exact videos you supplied.

   Their individual exercise names should only be assigned
   after verifying the YouTube title.
*/

const routine = [

    {
        name: "DAREBEE Video 1",
        block: "Warm-up",
        work: 40,
        rest: 15,
        videoId: "Laz3U14KB2A"
    },

    {
        name: "DAREBEE Video 2",
        block: "Main",
        work: 40,
        rest: 15,
        videoId: "XkG6WUtuKSA"
    },

    {
        name: "DAREBEE Video 3",
        block: "Main",
        work: 40,
        rest: 15,
        videoId: "4XcGTvcSRxY"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentIndex = 0;

let phase = "prepare";

let timeLeft = 0;

let elapsedSeconds = 0;

let timer = null;

let paused = false;

let workoutStarted = false;

let youtubeReady = false;

let player = null;


/* =========================================================
   DOM
========================================================= */

const exerciseElement =
    document.getElementById("exercise");

const sourceElement =
    document.getElementById("source");

const timeElement =
    document.getElementById("time");

const totalTimeElement =
    document.getElementById("totalTime");

const routineList =
    document.getElementById("routineList");

const playPauseButton =
    document.getElementById("playPauseButton");

const videoPlaceholder =
    document.getElementById("videoPlaceholder");

const playerStatus =
    document.getElementById("playerStatus");


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady() {

    player = new YT.Player(
        "youtubePlayer",
        {

            /*
               No playlist is loaded here.

               This is intentional.

               We load individual videos by exact ID.
            */

            playerVars: {

                playsinline: 1,

                rel: 0,

                modestbranding: 1,

                iv_load_policy: 3

            },

            events: {

                onReady:
                    onPlayerReady,

                onStateChange:
                    onPlayerStateChange,

                onError:
                    onPlayerError

            }

        }
    );
}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    youtubeReady = true;

    videoPlaceholder.classList.add(
        "hidden"
    );

    playerStatus.textContent =
        "DAREBEE • ready";

    loadExerciseVideo(
        currentIndex,
        false
    );
}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        playerStatus.textContent =
            "DAREBEE • playing";

    }

    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        playerStatus.textContent =
            "DAREBEE • paused";

    }

    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        playerStatus.textContent =
            "DAREBEE • video ended";

    }
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube error:",
        event.data
    );

    playerStatus.textContent =
        "YouTube video unavailable";
}


/* =========================================================
   LOAD EXACT VIDEO
=========================================================

   THIS IS THE KEY FIX.

   We do NOT use:

       playlistIndex

   We do NOT use:

       cuePlaylist()

   We do NOT use:

       loadPlaylist()

   We use the exact video ID.

========================================================= */

function loadExerciseVideo(
    index,
    autoplay = false
) {

    if (
        !youtubeReady ||
        !player
    ) {
        return;
    }

    const exercise =
        routine[index];

    if (
        !exercise ||
        !exercise.videoId
    ) {
        return;
    }


    playerStatus.textContent =
        "DAREBEE • loading";


    /*
       Exact YouTube video.
    */

    if (autoplay) {

        player.loadVideoById({
            videoId:
                exercise.videoId,

            startSeconds: 0
        });

    }

    else {

        player.cueVideoById({
            videoId:
                exercise.videoId,

            startSeconds: 0
        });

    }

}


/* =========================================================
   SPEECH
========================================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(
            text
        );

    message.rate = 0.9;

    window.speechSynthesis.speak(
        message
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (

        String(minutes)
            .padStart(2, "0")

        +

        ":"

        +

        String(secs)
            .padStart(2, "0")
    );
}


/* =========================================================
   BUILD ROADMAP
========================================================= */

function buildRoutineList() {

    routineList.innerHTML = "";

    routine.forEach(
        (exercise, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "exercise-item pending";

            item.id =
                "exercise-" + index;


            item.innerHTML = `

                <div class="exercise-top">

                    <span class="status">
                        ○
                    </span>

                    <span class="exercise-name">
                        ${exercise.name}
                    </span>

                </div>

                <div class="progress-container">

                    <div
                        class="progress-bar"
                        id="progress-${index}">
                    </div>

                </div>
            `;


            item.addEventListener(
                "click",
                () => {

                    selectExercise(
                        index
                    );

                }
            );


            routineList.appendChild(
                item
            );

        }
    );


    updateRoutineList();
}


/* =========================================================
   SELECT EXERCISE
========================================================= */

function selectExercise(index) {

    clearInterval(timer);

    window.speechSynthesis.cancel();

    currentIndex =
        index;

    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    workoutStarted =
        true;

    paused =
        true;

    playPauseButton.textContent =
        "▶";


    /*
       EXACT VIDEO CHANGES HERE.
    */

    loadExerciseVideo(
        currentIndex,
        false
    );


    updateDisplay();
}


/* =========================================================
   UPDATE ROADMAP
========================================================= */

function updateRoutineList() {

    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }

            const status =
                item.querySelector(
                    ".status"
                );

            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "completed",
                "pending"
            );


            if (
                index < currentIndex
            ) {

                item.classList.add(
                    "completed"
                );

                status.textContent =
                    "✓";

                progress.style.width =
                    "100%";

            }


            else if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

                status.textContent =
                    "●";


                if (
                    phase === "work"
                ) {

                    const completed =
                        exercise.work -
                        timeLeft;

                    const percentage =
                        Math.min(
                            100,
                            Math.max(
                                0,
                                (
                                    completed /
                                    exercise.work
                                ) * 100
                            )
                        );

                    progress.style.width =
                        percentage + "%";

                }

                else {

                    progress.style.width =
                        "0%";

                }


                item.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }


            else {

                item.classList.add(
                    "pending"
                );

                status.textContent =
                    "○";

                progress.style.width =
                    "0%";

            }

        }
    );
}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

    const exercise =
        routine[currentIndex];

    if (!exercise) {
        return;
    }


    if (
        phase === "prepare"
    ) {

        exerciseElement.textContent =
            "Prepare for " +
            exercise.name +
            " (" +
            (currentIndex + 1) +
            "/" +
            routine.length +
            ")";

    }

    else if (
        phase === "work"
    ) {

        exerciseElement.textContent =
            exercise.name +
            " (" +
            (currentIndex + 1) +
            "/" +
            routine.length +
            ")";

    }

    else if (
        phase === "rest"
    ) {

        const next =
            routine[
                currentIndex + 1
            ];

        exerciseElement.textContent =
            "Rest — Next: " +
            (
                next
                    ? next.name
                    : "Workout Complete"
            );
    }


    sourceElement.textContent =
        "How to: DAREBEE";


    timeElement.textContent =
        formatTime(timeLeft);


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    updateRoutineList();
}


/* =========================================================
   START
========================================================= */

function startTimer() {

    clearInterval(timer);

    currentIndex = 0;

    phase =
        "prepare";

    paused =
        false;

    workoutStarted =
        true;

    elapsedSeconds =
        0;

    timeLeft =
        5;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        0,
        true
    );


    updateDisplay();


    speak(
        "Prepare for " +
        routine[0].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePause() {

    if (
        !workoutStarted
    ) {

        startTimer();

        return;
    }


    paused =
        !paused;


    if (paused) {

        playPauseButton.textContent =
            "▶";

        window.speechSynthesis.cancel();


        if (
            youtubeReady &&
            player
        ) {

            player.pauseVideo();

        }

    }

    else {

        playPauseButton.textContent =
            "❚❚";


        if (
            youtubeReady &&
            player
        ) {

            player.playVideo();

        }

    }
}


/* =========================================================
   NEXT
========================================================= */

function skipMove() {

    if (
        !workoutStarted
    ) {
        return;
    }

    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    /*
       EXACT NEW VIDEO.
    */

    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   PREVIOUS
========================================================= */

function previousMove() {

    if (
        !workoutStarted
    ) {
        return;
    }

    clearInterval(timer);

    window.speechSynthesis.cancel();


    if (
        currentIndex <= 0
    ) {

        currentIndex = 0;

        phase =
            "prepare";

        timeLeft =
            5;


        loadExerciseVideo(
            0,
            false
        );


        updateDisplay();

        return;
    }


    currentIndex--;


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;

    paused =
        false;


    playPauseButton.textContent =
        "❚❚";


    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );


    timer =
        setInterval(
            tick,
            1000
        );
}


/* =========================================================
   RESET
========================================================= */

function resetTimer() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    currentIndex =
        0;

    phase =
        "prepare";

    timeLeft =
        0;

    elapsedSeconds =
        0;

    paused =
        false;

    workoutStarted =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Press Play";


    sourceElement.textContent =
        "DAREBEE";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        "00:00";


    loadExerciseVideo(
        0,
        false
    );


    updateRoutineList();
}


/* =========================================================
   TIMER
========================================================= */

function tick() {

    if (paused) {
        return;
    }


    elapsedSeconds++;


    if (
        timeLeft > 0
    ) {

        timeLeft--;

    }


    if (

        phase === "prepare" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "prepare" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    if (

        phase === "work" &&

        timeLeft === 10

    ) {

        speak(
            "10 seconds left"
        );

    }


    if (

        phase === "work" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "work" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    if (

        phase === "rest" &&

        timeLeft <= 3 &&

        timeLeft > 0

    ) {

        speak(
            String(timeLeft)
        );

    }


    if (

        phase === "rest" &&

        timeLeft === 0

    ) {

        nextPhase();

        return;
    }


    updateDisplay();
}


/* =========================================================
   NEXT PHASE
========================================================= */

function nextPhase() {

    if (
        phase === "prepare"
    ) {

        phase =
            "work";

        timeLeft =
            routine[
                currentIndex
            ].work;


        updateDisplay();


        speak(
            "Start " +
            routine[
                currentIndex
            ].name
        );


        return;
    }


    if (
        phase === "work"
    ) {

        const exercise =
            routine[
                currentIndex
            ];


        if (
            exercise.rest === 0
        ) {

            goToNextExercise();

            return;
        }


        phase =
            "rest";

        timeLeft =
            exercise.rest;


        /*
           Pause video during rest.
        */

        if (
            youtubeReady &&
            player
        ) {

            player.pauseVideo();

        }


        updateDisplay();


        speak("Rest");

        return;
    }


    if (
        phase === "rest"
    ) {

        goToNextExercise();

    }
}


/* =========================================================
   NEXT EXERCISE
========================================================= */

function goToNextExercise() {

    currentIndex++;


    if (
        currentIndex >=
        routine.length
    ) {

        finishWorkout();

        return;
    }


    phase =
        "work";

    timeLeft =
        routine[
            currentIndex
        ].work;


    /*
       EXACT NEXT DAREBEE VIDEO.
    */

    loadExerciseVideo(
        currentIndex,
        true
    );


    updateDisplay();


    speak(
        "Start " +
        routine[
            currentIndex
        ].name
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishWorkout() {

    clearInterval(timer);

    window.speechSynthesis.cancel();


    workoutStarted =
        false;

    paused =
        false;


    playPauseButton.textContent =
        "▶";


    exerciseElement.textContent =
        "Workout Complete!";


    sourceElement.textContent =
        "";


    timeElement.textContent =
        "00:00";


    totalTimeElement.textContent =
        formatTime(
            elapsedSeconds
        );


    routine.forEach(
        (exercise, index) => {

            const item =
                document.getElementById(
                    "exercise-" + index
                );

            if (!item) {
                return;
            }


            const status =
                item.querySelector(
                    ".status"
                );


            const progress =
                document.getElementById(
                    "progress-" + index
                );


            item.classList.remove(
                "active",
                "pending"
            );


            item.classList.add(
                "completed"
            );


            status.textContent =
                "✓";


            progress.style.width =
                "100%";

        }
    );


    speak(
